# 派生序列：在下载并清洗完上面的序列后计算。
#   chain_index  用环比（mom）连乘、同比（yoy）补齐，构造定基指数（lib.preprocess.china.chain_index）；
#                mom_start 可以让早期不可靠的环比改由同比回推
#   index_to_rate 把"上年同期=100"类指数转成百分比增长率
derived:
  - id: cpi_index
    label: 居民消费价格定基指数（2020=100，由环比链接、同比补齐）
    group: 价格
    method: chain_index
    mom: cpi_mom
    yoy: cpi_yoy
    # 2000–2001 年官方环比与同比明显不一致（12 个月环比连乘与同比最多差约 4.8 个百分点），
    # 这段改由同比回推，2002 年起才用环比连乘
    mom_start: '2002-01'
    base: 2020
    unit: 2020=100
    tcode: 5
    sa: false
  - id: core_cpi_index
    label: 核心 CPI 定基指数（2020=100）
    group: 价格
    method: chain_index
    mom: core_cpi_mom
    yoy: core_cpi_yoy
    base: 2020
    unit: 2020=100
    tcode: 5
    sa: false
  - id: ppi_index
    label: 工业生产者出厂价格定基指数（2020=100）
    group: 价格
    method: chain_index
    mom: ppi_mom
    yoy: ppi_yoy
    base: 2020
    unit: 2020=100
    tcode: 5
    sa: false
  - id: cpi_inflation
    label: CPI 同比通胀率
    group: 价格
    method: index_to_rate
    source: cpi_yoy
    unit: '%'
    tcode: 1
    sa: false
  - id: ppi_inflation
    label: PPI 同比涨幅
    group: 价格
    method: index_to_rate
    source: ppi_yoy
    unit: '%'
    tcode: 1
    sa: false
