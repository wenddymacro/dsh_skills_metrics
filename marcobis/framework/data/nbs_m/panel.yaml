# 国家统计局月度宏观面板（nbs_m）的定义。
#
# scripts/tools/nbs_update.py 读取本文件，从国家数据平台下载每个序列（自动拼接分段表），
# 按 clean 字段清洗，再计算 derived 中的派生序列，写出 dataset.csv 等文件。
#
# 字段说明
#   id       列名（dataset.csv 的列，lib.load_dataset 用它取数）
#   label    中文名称
#   group    分组（价格 / 生产 / 需求 / 外贸 / 财政 / 货币 / 景气 / 就业）
#   catalog  目录路径：从"月度数据"往下，用 / 分隔；分段表写基础名（不带时段）即可
#   key      指标键：指标编码（如 '6021702000021_1'）或显示名；编码在表内不唯一时用显示名。
#            一定要加引号：YAML 会把 6021702000021_1 这种带下划线的数字读成整数 60217020000211
#   unit     清洗后的单位
#   clean    清洗步骤（按顺序执行，可以是列表）：
#              none                  原样（只做分段拼接）
#              cumulative_to_period  年内累计值 → 当月值（1–2 月合并时平均拆分，见 lib.preprocess.china）
#              fill_january          增长率序列 1 月缺失时用 1–2 月累计同比（2 月值）填补；
#                                    同时给 jan_feb_from（同表"累计增长"指标的键）时，1、2 月都缺的年份
#                                    也用 1–2 月累计增长填补
#   tcode    建议的平稳化变换，沿用 FRED-MD 的编码：
#              1 = 水平，2 = 一阶差分，4 = 对数，5 = 对数差分，6 = 对数二阶差分
#            对数据不做任何变换；只供设定阶段参考。注意：多数序列未经季节调整，
#            水平量做对数差分前需先季调，或改用同比口径。
#   sa       是否经过季节调整（NBS 公布的月度数据基本都是 false）
#   monotone （可选，仅配合 cumulative_to_period）true 时，某年已公布的累计值出现下降，就把这一年
#            整年记缺失（说明这一年的"累计值"不是累计口径），年份写进 metadata.yaml 的
#            nonmonotone_years。只给当期值不可能为负的流量打开；贸易差额、利润不要打开
#   start    （可选）从这个日期开始请求，如 '2017-01'。表的数据起点很晚时设置，避免请求大段空区间
#
# 改动本文件后重新运行 nbs_update.py 即可。可以增删序列；用
#   python3 scripts/tools/nbs_tool.py search 月度 关键词
#   python3 scripts/tools/nbs_tool.py indicators 月度 "目录路径"
# 查找目录和指标键。

