derived:
  - id: gdp_deflator_yoy
    label: GDP 平减指数同比（由现价 / 不变价的同比增速之比推算）
    group: 价格
    method: deflator_yoy
    nominal: gdp
    real_yoy_index: gdp_yoy_index
    unit: '%'
    tcode: 1
    sa: false
  - id: real_gdp_growth
    label: 实际 GDP 同比增长率
    group: 核算
    method: index_to_rate
    source: gdp_yoy_index
    unit: '%'
    tcode: 1
    sa: false
