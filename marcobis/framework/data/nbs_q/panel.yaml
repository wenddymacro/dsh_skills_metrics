# 国家统计局季度宏观面板（nbs_q）的定义。字段说明见 data/nbs_m/panel.yaml。
# 日期约定与 FRED-QD 一致：季度用季末月份的 1 日（一季度 = 3 月 1 日）。
# clean 可用：none | cumulative_to_period（年内累计 → 当季）。

id: nbs_q
freq: Q
name: 国家统计局季度宏观面板
source: 国家统计局 国家数据 https://data.stats.gov.cn/
area: 全国

series:
