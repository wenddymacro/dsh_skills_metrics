    label: 国内生产总值（现价，当季）
    group: 核算
    catalog: 国民经济核算/国内生产总值 (现价)
    key: 'db8e5a86c08246e79b1b11251927e740_1'
    unit: 亿元
    clean: none
    tcode: 5
    sa: false
