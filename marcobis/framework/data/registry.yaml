datasets:
- id: fred_md
  name: FRED-MD Monthly Database
  description: Monthly US macro variables; raw observations, with the source's
    recommended transformation codes in transform_codes.csv (not applied)
  source: McCracken and Ng (2016); Federal Reserve Bank of St. Louis
  url: https://research.stlouisfed.org/econ/mccracken/fred-databases/
  frequency: monthly
  variables: 126   # nominal series count in the current vintage; see variables_actual (the value code relies on) below
  sample_start: 1959-01
  sample_end: updated monthly
  last_updated: '2026-04-11'
  vintage: 2026-03
  transforms_applied: false
  verified_by: automated quality check
  path: data/fred_md/
  observations: 806
  variables_actual: 126
  sample_start_actual: 1959-01
  sample_end_actual: 2026-02
  missing_pct: 1.0
  covers:
  - output and income
  - labour market
  - housing
  - consumption and orders
  - money and credit
  - interest rates and spreads
  - prices
  - stock market
  - exchange rates
- id: fred_qd
  name: FRED-QD Quarterly Database
  description: Quarterly US macro variables; raw observations, with the source's
    recommended transformation codes in transform_codes.csv (not applied)
  source: McCracken and Ng (2020); Federal Reserve Bank of St. Louis
  url: https://research.stlouisfed.org/econ/mccracken/fred-databases/
  frequency: quarterly
  variables: 248
  sample_start: 1959Q1
  sample_end: updated quarterly
  last_updated: '2026-04-11'
  vintage: 2026-03
  transforms_applied: false
  verified_by: automated quality check
  path: data/fred_qd/
  observations: 268
  variables_actual: 245
  sample_start_actual: 1959Q1
  sample_end_actual: 2025Q4
  missing_pct: 3.2
  index_convention: "DatetimeIndex with end-of-quarter month (March, June, September,\
    \ December) as the date. To merge with other quarterly sources that use start-of-quarter\
    \ or generic quarterly periods, convert both to PeriodIndex('Q') first;\
    \ pandas' default ``.resample(\"QS\").mean()`` produces start-of-quarter timestamps\
    \ which will NOT align with FRED-QD and silently produce all-NaN merges.\n"
  covers:
  - all FRED-MD categories aggregated quarterly
  - GDP components
  - national accounts detail
# --- 国家统计局（NBS）面板：由 scripts/tools/nbs_update.py 下载清洗；dataset.csv 不随框架分发 ---
# 版本（下载日期）、每个序列的来源目录与分段、清洗步骤记录在各目录的 metadata.yaml；
# 列的中文名、单位和建议变换见 series_info.csv。面板定义在 panel.yaml，可增删序列。
- id: nbs_m
  name: 国家统计局月度宏观面板
  description: 中国月度宏观数据（价格、工业、消费、投资、房地产、外贸、财政、货币、PMI、失业率），
    已拼接分段表、累计值转当月值、1–2 月合并处理，并链接出 CPI / 核心 CPI / PPI 定基指数；
    多数序列未经季节调整
  source: 国家统计局 国家数据
  url: https://data.stats.gov.cn/
  frequency: monthly
  sample_start: 见 metadata.yaml（各序列起点不同，最早约 1987 年）
  sample_end: 每月更新
  transforms_applied: false
  verified_by: scripts/tools/nbs_update.py
  path: data/nbs_m/
  index_convention: DatetimeIndex，当月 1 日
  covers:
  - 价格（CPI、核心 CPI、PPI、购进价格，同比 / 环比 / 定基）
  - 生产（规上工业增加值同比、服务业生产指数、发电量、工业企业利润）
  - 需求（社会消费品零售总额、固定资产投资、房地产投资与销售）
  - 外贸（出口、进口、差额）
  - 财政（一般公共预算收支）
  - 货币（M0、M1、M2）
  - 景气与就业（PMI、城镇调查失业率）
- id: nbs_q
  name: 国家统计局季度宏观面板
  description: 中国季度国民经济核算（现价 / 不变价 GDP 及主要行业增加值、GDP 同比指数、
    季调环比增速）、产能利用率、居民人均可支配收入、固定资产投资价格指数，以及推算的 GDP 平减指数同比
  source: 国家统计局 国家数据
  url: https://data.stats.gov.cn/
  frequency: quarterly
  sample_start: 见 metadata.yaml（GDP 自 1992Q1）
  sample_end: 每季度更新
  transforms_applied: false
  verified_by: scripts/tools/nbs_update.py
  path: data/nbs_q/
  index_convention: DatetimeIndex，季末月份 1 日（与 FRED-QD 一致）；与季初日期的数据合并前先统一转成 PeriodIndex('Q')
  covers:
  - 国民经济核算（GDP 及三次产业、工业、房地产业增加值）
  - 实际增长（GDP 指数、季调环比）
  - 产能利用率、居民收入、投资价格
- id: nbs_a
  name: 国家统计局年度宏观面板
  description: 中国年度宏观数据（GDP 及支出法构成、平减指数、人口与就业、工资、价格指数、财政、
    固定资产投资、对外贸易等），已拼接分段表
  source: 国家统计局 国家数据
  url: https://data.stats.gov.cn/
  frequency: annual
  sample_start: 见 metadata.yaml（多数序列自 1978 年）
  sample_end: 每年更新
  transforms_applied: false
  verified_by: scripts/tools/nbs_update.py
  path: data/nbs_a/
  index_convention: DatetimeIndex，当年 1 月 1 日
  covers:
  - 国民经济核算（生产法、支出法）
  - 人口、就业、工资
  - 价格、财政、投资、外贸
